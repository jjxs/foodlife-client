<div mat-dialog-title style="text-align: center">
  Welcome
</div>
<div mat-dialog-content>
  <div fxLayout="column">
    <div fxFlexAlign="center" fxLayout="row">
      <div>
        <mat-icon color="primary" style="font-size:32px;margin:15px">account_circle</mat-icon>
      </div>
      <mat-form-field>
        <input matInput placeholder="Shop ID" [(ngModel)]="saas_id" required>
      </mat-form-field>
    </div>
  </div>
</div>
<div style="text-align: center">  
  <button mat-raised-button color="primary" (click)="save()" style="margin-left: 20px;">OK</button>
</div>
